<style>
:root{--bg:#F4F2EE;--paper:#fff;--ink:#1E2124;--muted:#5D646B;--line:#DCD8D1;--accent:#C98A12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Microsoft JhengHei',system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px}h1,h2,h3{line-height:1.35}h1{font-size:28px;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}p{margin:8px 0}a{color:#3049a0}label{display:block;font-weight:700;margin-top:14px}input,select,textarea{width:100%;font:inherit;padding:9px 12px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px}textarea{min-height:95px;resize:vertical}input[type=checkbox]{width:auto}input[type=file]{font-size:14px}button,.button{font:inherit;font-weight:bold;background:var(--accent);color:#fff;border:2px solid var(--accent);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-block}button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.card{background:var(--paper);padding:22px;border:1px solid var(--line);border-radius:18px;margin-bottom:18px}.muted,small{color:var(--muted)}small{display:block}.message{white-space:pre-wrap;padding:12px 0;min-height:44px}.message.error{color:#a12c20}.message.success{color:#1d6247}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.full{grid-column:1/-1}.honeypot{position:absolute;left:-9999px}.badge{display:inline-block;padding:3px 10px;background:#ECE8E1;border-radius:99px;font-size:14px}.meta{font-size:14px;color:var(--muted)}.detail{white-space:pre-wrap;overflow-wrap:anywhere}.filter{display:flex;gap:10px;align-items:center;margin:18px 0}.filter select{max-width:240px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #3D55B8;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}.card{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:24px}}
</style>
